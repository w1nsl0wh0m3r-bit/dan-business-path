ted craft cocktails. Membership model builds recurring revenue and guest loyalty. Quality-over-volume approach — they turn down operators who don't fit the brand.","traction":"Grown from 1 location (2016) to 6 locations by early 2024 across 5 cities in 4 states. Franchise pipeline includes Tampa (2025), Durham NC (June 2026). SBA data shows ~$2.7M average location revenue. Featured in FSR NextGen 25 as a rising restaurant to watch.","funding":"Bootstrap","entry_path":"Franchise area developer or growth partner for multi-unit expansion. Brand is early in franchising with disciplined growth approach.","dan_value_add":"Capital for franchise infrastructure, real estate strategy for luxury market expansion, brand building, operational systems for maintaining quality at scale","first_diligence":"What does a new location cost to build out (the speakeasy interiors are custom)? How dependent is the experience on finding the right operator personality?","sources":["https://www.fsrmagazine.com/feature/what-is-red-phone-booth-inside-the-secret-speakeasy-expanding-across-the-u-s/","https://peersense.com/franchise/red-phone-booth","https://voyageatl.com/interview/meet-stephen-de-haan-red-phone-booth-downtown/","https://www.fsrmagazine.com/feature/fsr-nextgen-25-rising-restaurants-to-watch-beyond-2025/"],"last_updated":"2026-07-23","added_date":"2026-07-23","source_file":"discovery_cron"},{"id":"los-dos-potrillos","name":"Los Dos Potrillos","category":"Food & Beverage","subcategory":"Authentic Mexican Restaurant","units":6,"units_text":"6 locations across Colorado (Highlands Ranch, Littleton, Parker, Castle Rock, Denver, Centennial) plus food truck fleet","hq_city":"Highlands Ranch","hq_state":"CO","lat":39.55,"lng":-104.97,"founded":2006,"status":"watch","team":"Jose Ramirez (Founder), sons Luis Ramirez and Daniel Ramirez (leadership team). Family-run operation.","story":"Founded by Jose Ramirez, an immigrant who named the restaurant after his two sons ('Los Dos Potrillos' = 'the young","https://www.zoominfo.com/c/brooklyn-robot-foundry/358006089","https://brooklynrobotfoundry.com/blog/news/2025-impact-report/","https://1851franchise.com/brooklyn-robot-foundry-franchise-deep-dive-2732231"],"last_updated":"2026-07-24","added_date":"2026-07-24","source_file":"discovery_cron"},{"id":"always-you-med-spa","name":"Always You Med Spa","category":"Med Spa & Wellness","subcategory":"Medical Aesthetics / Injectables","units":4,"units_text":"4 locations, franchising since 2024. +33.3% growth rate.","hq_city":"San Antonio","hq_state":"TX","lat":29.42,"lng":-98.49,"founded":2015,"status":"target","team":"Rebecca Diaz (CEO/Co-owner). Additional team details limited — confidence on full team composition is moderate.","story":"Founded in 2015 in San Antonio, Always You Med Spa offers high-demand aesthetic services including Botox, dermal fillers, and medical weight loss programs. Began franchising in 2024 — very early stage franchise system. Positioned in the fastest-growing segment of the $25B med spa market. Low unit count but established operating history (9 years before franchising).","traction":"4 open locations with +33.3% growth rate. Franchising since 2024. Part of the booming med spa / aesthetic services market projected to hit $25B by 2027. Investment cost is moderate at ~$187K initial.","funding":"Bootstrap","entry_path":"Early-stage growth partner for franchise expansion. Dan could be a founding area developer in Texas or new markets. The 9-year operating history before franchising suggests a proven model ready to scale.","dan_value_add":"Capital for franchise buildout, med spa operations expertise, market expansion strategy, brand building in the crowded med spa space, potential area developer role in Texas","first_diligence":"What are the per-location revenue and EBITDA for the 4 operating locations, and what is the average unit volume? Is the medical weight loss program the growth driver?","sources":["https://www.entrepreneur.com/franchises/directory/always-you-med-spa/335226765","https://1851franchise.com/top-20-medspa-franchise-opportunities-the-top-aesthetic-and-wellness-brands-to-invest-in-2729791"],"last_updated":"2026-07-24","added_date":"2026-07-24","source_file":"discovery_cron"},{"id":"doughnuttery","name":"Doughnuttery","category":"Food & Beverage","subcategory":"Dessert / Mini Doughnuts","units":6,"units_text":"6 total units (2 franchised + 4 company-owned), primarily in NYC food halls and markets","hq_city":"New York","hq_state":"NY","lat":40.72,"lng":-74.01,"founded":2012,"status":"target","team":"Evan Feldman (Founder/CEO) + Marlo Feldman (Co-founder). Family-run with small team.","story":"Since 2012, Doughnuttery has been a NYC staple in iconic food halls like Chelsea Market. Specializes in hot, fresh, uniquely sugared mini doughnuts with proprietary sugar blends using exotic ingredients (Pumpkin Spice, Coca Loco, etc.). The entertaining cooking method — frying to order in front of customers — creates a visual spectacle. Featured on Cooking Channel's Unique Sweets. 150-1,000 sq ft footprint means extremely versatile real estate.","traction":"6 total units in high-traffic NYC locations (Chelsea Market, Time Out Market). Featured on Cooking Channel. Multiple revenue streams: retail, catering, events, pop-ups, festivals. Small footprint = low buildout cost. Started franchising recently.","funding":"Bootstrap","entry_path":"Growth partner for franchise expansion beyond NYC. Dan could help systematize the franchise model and bring the concept to new markets. The small footprint and low buildout cost makes this highly scalable.","dan_value_add":"Franchise infrastructure development, capital for multi-market expansion, operational systems for consistency, brand building beyond NYC","first_diligence":"What are the per-location unit economics (average revenue, food cost, labor cost) for the 4 company-owned NYC locations, and how do franchisee economics compare?","sources":["https://www.doughnuttery.com/","https://www.doughnutteryfranchise.com/","https://www.youtube.com/watch?v=3rJ4lW7X-hE","https://www.doughnuttery.com/order"],"last_updated":"2026-07-24","added_date":"2026-07-24","source_file":"discovery_cron"},{"id":"sunday-morning-nyc","name":"Sunday Morning","category":"Food & Beverage","subcategory":"Single-Item Bakery (Cinnamon Rolls)","units":2,"units_text":"2 locations in Manhattan (East Village + NoMad)","hq_city":"New York","hq_state":"NY","lat":40.73,"lng":-73.98,"founded":2025,"status":"target","team":"Armando Litiatco (Founder/Chef) + Ahmet Kiranbay (Co-founder). Both trained chefs and life partners.","story":"Two chef partners launched a single-item bakery dedicated entirely to cinnamon rolls in the East Village in January 2025. 10 unique flavors daily, sells out by 2pm. Featured on CBS Mornings with Gayle King — massive NYC food buzz. Opening second location in NoMad's 3,000 sq ft multilevel space. Cinnamon rolls are having a moment in NYC and Sunday Morning is the brand defining it. Eater, NY Mag, and social media all over it.","traction":"Sells out daily by 2pm. Lines down the block. CBS Mornings national TV feature. Massive Instagram/social following. Second location (NoMad) signed at 3,000 sq ft — significant jump from original small footprint. Featured in Eater NYC and multiple food press.","funding":"Bootstrap","entry_path":"Dan could be the capital partner for expansion beyond Manhattan — Brooklyn, Queens, NJ, then regional. Brand is still very early with no franchise infrastructure. Opportunity to build the 'cinnamon roll category' before competitors.","dan_value_add":"Capital for multi-unit expansion, operational systems to maintain quality at scale, brand positioning beyond NYC, potential franchise or corporate growth model.","first_diligence":"What are the daily unit economics at the East Village location (daily revenue, cost of goods, labor), and is the sell-out model sustainable or a capacity constraint?","sources":["https://www.su é locations across NYC (Manhattan + Brooklyn). 40-person team. 500+ wholesale customers. D2C business growing 40% YoY. Kickstarter campaign funded by 465 community backers. Featured on Bloomberg TV, Saxby's, Tribeca Citizen, Eater, Daily Coffee News. Oishii strawberry collab. Strong Instagram following. Expanding into Greenwich, CT.","funding":"Bootstrap + revenue-based financing (Clearco) + community crowdfunding (Kickstarter). No VC or PE. Pitched 100+ investors without institutional commitment — still 100% founder-owned.","entry_path":"Growth partner for multi-market expansion beyond NYC. Dan provides capital and operational systems for East Coast expansion (Boston, DC, LA, Chicago). Hannah's proven the model and supply chain — this is about scaling what works, not validating the concept.","dan_value_add":"Expansion capital without dilution pressure, multi-unit retail operations expertise, site selection in new markets, brand positioning for national scale, supply chain optimization for matcha sourcing","first_diligence":"What are the per-café unit economics (AUV, margins, payback), and how much of the current 8-unit success is driven by NYC-specific matcha demand density vs. a transferable brand/concept?","sources":["https://www.matchaful.com/pages/about-us","https://www.clear.co/case-studies/matchaful","https://www.saxbyscoffee.com/news-item/Hannah-Habes-matchaful/","https://www.kickstarter.com/projects/236725611/matchaful-west-village-nyc-matcha-cafe","https://tribecacitizen.com/2026/04/10/an-update-on-the-new-businesses-for-greenwich/","https://www.instagram.com/matchaful/","https://www.linkedin.com/in/hannah-habes-bba2a612","https://dailycoffeenews.com/2025/06/27/weekly-coffee-news-banking-on-matcha-all-16-coe-winners-in-pods/"],"last_updated":"2026-07-27","added_date":"2026-07-27","source_file":"discovery_cron"},{"id":"supreme-wraps","name":"Supreme Wraps","category":"Automotive Services","subcategory":"Luxury Car Wraps, PPF & Tint","units":6,"units_text":"6 locations: Dallas/The Colony (HQ), Arizona, Florida, Texas, + Las Vegas & Nashville coming soon. Mix of corporate and franchise units.","hq_city":"The Colony","hq_state":"TX","lat":33.09,"lng":-96.89,"founded":2018,"status":"target","team":"Steve Mandala (Founder) + family ownership team. Certified wrap technicians, PPF specialists, custom design consultants. Family-owned and operated.","story":"The #1 procurer of color-change wrap films in the United States. Family-owned luxury automotive restyling business that has completed 5,000+ projects for professional athletes, car collectors, and high-net-worth vehicle owners. Developed a proprietary PPF line called APTERIX (three advanced films engineered for clarity and durability). Now franchising with a $250K–$500K investment range and $49,950 franchise fee. Positioned in the $2.3B US automotive wrap films market growing at ~19% CAGR.","traction":"6 units across TX, AZ, FL. 5,000+ completed projects. Thousands of verified 5-star reviews. #1 in US for color-change wrap film procurement. Proprietary APTERIX product line. Active franchise program with territories in AZ, TX, FL, NV. Featured on YouTube franchise content. The Colony Chamber of Commerce member.","funding":"Bootstrap (family-owned, self-funded through operating revenue)","entry_path":"Multi-unit franchise development partner or equity stake in franchisor entity. Dan could accelerate franchise growth in major markets — the brand has proven demand but needs capital and infrastructure to scale beyond the Southwest.","dan_value_add":"Franchise development capital, operational systems for multi-unit scaling, territory strategy, brand marketing for national awareness, potential retail product line (APTERIX PPF distribution)","first_diligence":"What are the per-location revenue and margins, and is the 'family-owned' operational model transferable to franchise operators at scale? Also: how dependent is revenue on the founders' personal client relationships?","source const CATEGORY_COLORS = {
'Youth Sports & Kids': '#7faa6f',
'Pet Services': '#d4825c',
'Auto Services': '#c9a050',
'Bakery': '#e8967d',
'Bagels': '#c9a850',
'Frozen Dessert': '#5b9ab8',
'Swedish Candy': '#d4565c',
'Fast Casual': '#e0a060',
'Beverage': '#6b8eb5',
'Med Spa & Wellness': '#c070a0',
'Beauty & Aesthetics': '#c070a0',
'Home Technology Services': '#7090c0',
'Consumer Services': '#999999',
};

let map, markerLayer, markers = {};
let activeCategory = null;

function init() {
map = L.map('map', { zoomControl: true, attributionControl: false }).setView([39.5, -98.35], 4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
maxZoom: 18, subdomains: 'abcd',
}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
maxZoom: 18, subdomains: 'abcd', pane: 'shadowPane'
}).addTo(map);
markerLayer = L.layerGroup().addTo(map);

const cats = [...new Set(TARGETS.map(t => t.category))].sort();
const sel = document.getElementById('categoryFilter');
cats.forEach(c => {
const opt = document.createElement('option');
opt.value = c; opt.textContent = c;
sel.appendChild(opt);
});
buildLegend();
applyFilters();
}

function buildLegend() {
const cats = [...new Set(TARGETS.map(t => t.category))].sort();
const legend = document.getElementById('legend');
let html = '<h4>Categories</h4>';
cats.forEach(c => {
const color = CATEGORY_COLORS[c] || '#999';
const count = TARGETS.filter(t => t.category === c).length;
html += '<div class="legend-item" onclick="toggleCategory(\'' + c + '\')">' +
'<div class="dot" style="background:' + color + '"></div>' +
'<span>' + c + '</span>' +
'<span class="count">' + count + '</span></div>';
});
legend.innerHTML = html;
}

function toggleCategory(cat) {
activeCategory = (activeCategory === cat) ? null : cat;
applyFilters();
}

function applyFilters() {
const search = document.getElementById('searchInput').value.toLowerCase();
const status = document.getElementById('statusFilter').value;
const category = document.getElementById('categoryFilter').value;
const unitFilter = document.getElementById('unitFilter').value;

const filtered = TARGETS.filter(t => {
if (search) {
const haystack = (t.name + ' ' + (t.hq_city||'') + ' ' + (t.story||'') + ' ' + (t.category||'')).toLowerCase();
if (!haystack.includes(search)) return false;
}
if (status && t.status !== status) return false;
const cat = category || activeCategory;
if (cat && t.category !== cat) return false;
if (unitFilter) {
const parts = unitFilter.split('-');
const min = parseInt(parts[0]); const max = parseInt(parts[1]);
const u = t.units || 0;
if (u < min || u > max) return false;
}
return true;
});
renderList(filtered);
renderMarkers(filtered);
renderStats(filtered);
}

function renderList(items) {
const list = document.getElementById('targetList');
document.getElementById('totalCount').textContent = items.length;
if (items.length === 0) {
list.innerHTML = '<div class="empty-state">No targets match filters.<br>Try widening your search.</div>';
return;
}
list.innerHTML = items.map(t => {
const color = CATEGORY_COLORS[t.category] || '#999';
return '<div class="list-item" onclick="selectTarget(\'' + t.id + '\')" data-id="' + t.id + '">' +
'<div class="list-item-dot" style="background:' + color + '"></div>' +
'<div class="list-item-content">' +
'<div class="list-item-name">' + t.name + '</div>' +
'<div class="list-item-meta">' +
'<span class="units">' + (t.units || '?') + ' units</span>' +
'<span>' + (t.hq_city || '') + (t.hq_state ? ', ' + t.hq_state : '') + '</span>' +
'<span class="badge b-' + t.status + '">' + t.status + '</span>' +
'</div>' +
'<div class="list-item-meta" style="margin-top:2px;font-size:10px">' + t.category + '</div>' +
'</div></div>';
}).join('');
}

function renderMarkers(items) {
markerLayer.clearLayers();
markers = {};
items.forEach(t => {
if (!t.lat || !t.lng) return;
const color = CATEGORY_COLORS[t.category] || '#999';
const marker = L.circleMarker([t.lat, t.lng], {
radius: 8, fillColor: color, color: '#0a0d12',
weight: 2, opacity: 1, fillOpacity: 0.85
});
const statusIcon = {target:'Target', watch:'Watch', comp:'Comp', kill:'Kill'}[t.status] || '';
marker.bindPopup(
'<b>' + t.name + '</b>' +
'<div class="popup-meta">' + statusIcon + ' &middot; ' + (t.units || '?') + ' units &middot; ' + t.category + '</div>' +
'<div class="popup-meta">' + (t.hq_city || '') + (t.hq_state ? ', ' + t.hq_state : '') + '</div>' +
'<div style="margin-top:8px"><a href="#" onclick="selectTarget(\'' + t.id + '\'); return false;">View details &rarr;</a></div>',
{maxWidth: 260}
);
marker.on('click', function() { selectTarget(t.id, false); });
marker.addTo(markerLayer);
markers[t.id] = marker;
});
}

function renderStats(items) {
const targets = items.filter(t => t.status === 'target').length;
const watch = items.filter(t => t.status === 'watch').length;
const comp = items.filter(t => t.status === 'comp').length;
const geocoded = items.filter(t => t.lat && t.lng).length;
document.getElementById('statsBar').innerHTML =
'<span><b>' + targets + '</b> targets</span>' +
'<span><b>' + watch + '</b> watch</span>' +
'<span><b>' + comp + '</b> comp</span>' +
'<span><b>' + geocoded + '</b> mapped</span>';
}

function selectTarget(id, fly) {
if (fly === undefined) fly = true;
const t = TARGETS.find(function(x) { return x.id === id; });
if (!t) return;
document.querySelectorAll('.list-item').forEach(function(el) { el.classList.remove('active'); });
const li = document.querySelector('[data-id="' + id + '"]');
if (li) { li.classList.add('active'); li.scrollIntoView({block:'nearest'}); }
if (fly && markers[id]) {
map.flyTo([t.lat, t.lng], 7, {duration: 0.8});
setTimeout(function() { if (markers[id]) markers[id].openPopup(); }, 600);
}
const color = CATEGORY_COLORS[t.category] || '#999';
const statusBadge = '<span class="badge b-' + t.status + '">' + t.status.toUpperCase() + '</span>';
const sources = (t.sources || []).map(function(s) {
let label = s;
try { label = new URL(s).hostname.replace('www.',''); } catch(e) {}
return '<a href="' + s + '" target="_blank">' + label + '</a>';
}).join('');
const buzzList = (t.buzz_signals || []).filter(function(b) { return b; }).map(function(b) {
return '<li>' + b + '</li>';
}).join('');

document.getElementById('detailContent').innerHTML =
'<span class="kicker" style="color:' + color + ';border-color:' + color + '33;background:' + color + '11">' + t.category + (t.subcategory ? ' &middot; ' + t.subcategory : '') + '</span>' +
'<h2>' + t.name + '</h2>' +
'<div class="sub">' + statusBadge + ' ' + (t.units || '?') + ' units &middot; ' + (t.hq_city || '') + (t.hq_state ? ', ' + t.hq_state : '') + (t.founded ? ' &middot; Founded ' + t.founded : '') + '</div>' +
'<div class="meta-grid">' +
'<div class="meta-item"><label>Units</label><span>' + (t.units_text || t.units || '\u2014') + '</span></div>' +
'<div class="meta-item"><label>Funding</label><span>' + (t.funding || 'Bootstrap') + '</span></div>' +
'<div class="meta-item"><label>Entry Path</label><span>' + (t.entry_path ? t.entry_path.substring(0,60) : '\u2014') + '</span></div>' +
'<div class="meta-item"><label>Status</label><span style="text-transform:capitalize">' + t.status + '</span></div>' +
'</div>' +
(t.story ? '<h3>Story</h3><div class="field-box"><p>' + t.story + '</p></div>' : '') +
(t.traction ? '<h3>Traction</h3><div class="field-box gold"><p>' + t.traction + '</p></div>' : '') +
(t.team ? '<h3>Team</h3><div class="field-box"><p>' + t.team + '</p></div>' : '') +
(buzzList ? '<h3>Buzz Signals</h3><div class="field-box green"><ul style="margin:0;padding-left:18px">' + buzzList + '</ul></div>' : '') +
(t.dan_value_add ? '<h3>Dan\'s Value Add</h3><div class="field-box blue"><p>' + t.dan_value_add + '</p></div>' : '') +
(t.first_diligence ? '<h3>First Diligence Question</h3><div class="field-box clay"><p>' + t.first_diligence + '</p></div>' : '') +
(sources ? '<div class="sources">' + sources + '</div>' : '') +
'<div style="margin-top:20px;font-size:10px;color:var(--muted)">Added: ' + (t.added_date || '?') + ' &middot; Updated: ' + (t.last_updated || '?') + '</div>';

document.getElementById('detailPanel').classList.add('open');
}

function closeDetail() {
document.getElementById('detailPanel').classList.remove('open');
document.querySelectorAll('.list-item').forEach(function(el) { el.classList.remove('active'); });
}

document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDetail(); });
init();
</script>
</body>
</html>
